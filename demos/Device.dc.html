    if (dev === 'eq8') this.buildEQ(T, s, look, g, card, btn, knob, label, disp, seg, dots);
    else if (dev === 'compressor') this.buildComp(T, s, look, g, card, btn, knob, label, disp, seg);
    else if (dev === 'wavetable') this.buildWT(T, s, look, g, card, btn, knob, label, disp, seg);
    else this.buildDrum(T, s, look, g, card, btn, knob, label, disp, seg);

    return { T: T, cards: cards, buttons: buttons, knobs: knobs, labels: labels, displays: displays, dots: dots, blocks: blocks };
  }

  // ---- EQ Eight ------------------------------------------------------------
  buildEQ(T, s, look, g, card, btn, knob, label, disp, seg, dots) {
    const self = this, b = s.sel.eqBand, bc = BANDC[b - 1];
    const fmtF = function (f) { return f >= 1000 ? f1(f / 1000) + ' kHz' : Math.round(f) + ' Hz'; };
    card(6, 128, 118, 462, 'Band ' + b);
    knob('eqFreq' + b, 25, 166, 80, 'Freq', fmtF(s.v['eqFreq' + b]), { lo: 20, hi: 20000, log: true, c: bc });
    knob('eqGain' + b, 25, 304, 80, 'Gain', f1(s.v['eqGain' + b]) + ' dB', { lo: -15, hi: 15, c: bc, bip: true });
    knob('eqQ' + b, 25, 442, 80, 'Q', s.v['eqQ' + b].toFixed(2), { lo: 0.1, hi: 6, log: true, c: bc });

    // display 840 x 462
    const W = 840, H = 462, fx = function (f) { return Math.log(f / 20) / Math.log(1000) * W; }, fy = function (db) { return H / 2 - db / 15 * (H / 2) * 0.92; };
    const resp = function (band, f) {
      const t = s.eqType[band - 1], fc = s.v['eqFreq' + band], gn = s.v['eqGain' + band], q = s.v['eqQ' + band], o = Math.log2(f / fc);
      if (t === 'bell') return gn / (1 + Math.pow(o * q * 2.2, 2));
      if (t === 'hshelf') return gn / (1 + Math.exp(-o * 4));
      if (t === 'lshelf') return gn / (1 + Math.exp(o * 4));
      if (t === 'hp') return -10 * Math.log10(1 + Math.pow(fc / f, 8));
      if (t === 'lp') return -10 * Math.log10(1 + Math.pow(f / fc, 8));
      return 0;
    };
    const paths = [];
    [30, 40, 50, 60, 70, 80, 90, 100, 200, 300, 400, 500, 600, 700, 800, 900, 1000, 2000, 3000, 4000, 5000, 6000, 7000, 8000, 9000, 10000, 20000].forEach(function (f) {
      const x = fx(f).toFixed(1); paths.push({ d: 'M' + x + ' 0V' + H, stroke: T.grid, sw: (f === 100 || f === 1000 || f === 10000) ? 1.4 : 1 });
    });
    [-12, -6, 6, 12].forEach(function (db) { paths.push({ d: 'M0 ' + fy(db).toFixed(1) + 'H' + W, stroke: T.grid, sw: 1 }); });
    paths.push({ d: 'M0 ' + fy(0).toFixed(1) + 'H' + W, stroke: 'rgba(255,255,255,0.14)', sw: 1 });
    // selected band's own shape, filled in its colour
    let sp = 'M0 ' + fy(0).toFixed(1), cp = '';
    for (let i = 0; i <= 220; i++) {
      const f = 20 * Math.pow(1000, i / 220);
      sp += 'L' + (i / 220 * W).toFixed(1) + ' ' + fy(s.on['eqb' + b] ? resp(b, f) : 0).toFixed(1);
      let tot = 0;
      for (let k = 1; k <= 8; k++) if (s.on['eqb' + k]) tot += resp(k, f);
      cp += (i ? 'L' : 'M') + (i / 220 * W).toFixed(1) + ' ' + Math.max(-20, Math.min(H + 20, fy(tot))).toFixed(1);
    }
    sp += 'L' + W + ' ' + fy(0).toFixed(1) + 'Z';
    paths.push({ d: sp, fill: rgba(bc, 0.16), stroke: rgba(bc, 0.55), sw: 1.2 });
    paths.push({ d: cp + 'L' + W + ' ' + H + 'L0 ' + H + 'Z', fill: look === 'satin' ? 'rgba(255,240,220,0.035)' : 'rgba(255,255,255,0.035)', stroke: 'none', sw: 0 });
    paths.push({ d: cp, stroke: T.curve, sw: 2.6, f: T.lineF('#ffffff') });
    disp(128, 128, W, H, paths, [{ x: fx(100), y: H - 10, t: '100' }, { x: fx(1000), y: H - 10, t: '1000' }, { x: fx(10000), y: H - 10, t: '10000' }, { x: 12, y: fy(12) + 4, t: '+12', anchor: 'start' }, { x: 12, y: fy(-12) + 4, t: '-12', anchor: 'start' }]);

    for (let k = 1; k <= 8; k++) {
      if (!s.on['eqb' + k]) continue;
      const t = s.eqType[k - 1], gx = fx(s.v['eqFreq' + k]), gy = (t === 'hp' || t === 'lp') ? fy(0) : fy(s.v['eqGain' + k]);
      const selB = k === b, c = BANDC[k - 1], sz = selB ? 30 : 24, drag = s.drag === 'ball' + k;
      dots.push({
        label: 'Band ' + k, txt: String(k), x: 128 + gx, y: 128 + gy, s: sz, m: -sz / 2,
        fg: selB ? (lum(c) > 0.6 ? '#1a1a1a' : '#ffffff') : mix(c, '#ffffff', 0.25),
        bg: selB ? 'radial-gradient(circle at 35% 30%, ' + mix(c, '#ffffff', 0.35) + ', ' + c + ' 70%)' : rgba(c, 0.18),
        sh: selB ? ['2px 3px 6px rgba(0,0,0,0.5)'].concat(T.glow(c, 1)).join(', ') : 'inset 0 0 0 2px ' + c + ', 1px 2px 4px rgba(0,0,0,0.45)',
        tf: drag ? 'scale(1.15)' : 'scale(1)',
        down: function (e) { self.ballDrag(k, e, 'down'); }, move: function (e) { self.ballDrag(k, e, 'move'); }, up: function (e) { self.ballDrag(k, e, 'up'); }
      });
    }

    card(972, 128, 122, 462, 'Mode');
    [['stereo', 'Stereo'], ['lr', 'L/R'], ['ms', 'M/S']].forEach(function (m, i) {
      btn('mode' + m[0], 980, 150 + i * 84, 106, 72, { txt: m[1], fs: 14, on: s.sel.eqMode === m[0], color: BLUE, k: 0.8, click: function () { self.setSel('eqMode', m[0]); } });
    });
    label(972, 420, 122, 'Oversampling', { fs: 10, tt: 'uppercase', ls: '0.06em' });
    seg('ovs', 980, 440, 106, 48, [['off', 'Off'], ['on', 'On']], 'eqOver', BLUE);

    card(6, 594, 118, 150, 'Adaptive Q');
    btn('aqOff', 14, 640, 48, 60, { txt: 'Off', on: !s.on.adaptQ, color: BLUE, k: 0.8, click: function () { if (s.on.adaptQ) self.setOn('adaptQ'); } });
    btn('aqOn', 68, 640, 48, 60, { txt: 'On', on: s.on.adaptQ, color: BLUE, k: 0.8, click: function () { if (!s.on.adaptQ) self.setOn('adaptQ'); } });

    card(128, 594, 840, 150, 'Bands');
    label(136, 632, 40, 'On', { align: 'left', fs: 12 });
    label(136, 694, 40, 'Type', { align: 'left', fs: 12 });
    const bw = (840 - 56 - 7 * 6) / 8;
    for (let k = 1; k <= 8; k++) {
      const x = 176 + (k - 1) * (bw + 6);
      btn('eqb' + k, x, 614, bw, 56, { txt: String(k), fs: 15, on: s.on['eqb' + k], color: BANDC[k - 1], k: 0.75, click: function () { self.setOn('eqb' + k); self.setSel('eqBand', k); } });
      const types = ['hp', 'lshelf', 'bell', 'notch', 'hshelf', 'lp'];
      btn('eqt' + k, x, 678, bw, 56, { d: I[s.eqType[k - 1]], is: 30, isw: 2, label: 'Band ' + k + ' type', click: function () {
        self.setState(function (st) { const et = st.eqType.slice(); et[k - 1] = types[(types.indexOf(et[k - 1]) + 1) % types.length]; return { eqType: et }; });
      } });
    }
    card(972, 594, 122, 150, 'Output');
    knob('eqScale', 984, 618, 44, 'Scale', Math.round(s.v.eqScale * 200) + ' %', { c: BLUE });
    knob('eqOut', 1040, 618, 44, 'Gain', f1((s.v.eqOut - 0.5) * 24) + ' dB', { c: BLUE, bip: true });
  }

  // ---- Compressor -------------------------------------------------------------
  buildComp(T, s, look, g, card, btn, knob, label, disp, seg) {
    const self = this, C = '#4c9bff', v = s.v;
    const thr = -40 + v.cThr * 40, ratio = 1 + Math.pow(v.cRatio, 2) * 19, knee = v.cKnee * 18;
    // transfer curve display
    card(6, 128, 196, 312, 'Transfer');
    const W = 176, H = 230, map = function (db) { return (db + 48) / 48; };
    const pts = [];
    for (let i = 0; i <= 80; i++) {
      const x = -48 + 48 * i / 80;
      let y;
      if (x < thr - knee / 2) y = x;
      else if (x > thr + knee / 2) y = thr + (x - thr) / ratio;
      else { const t = x - thr + knee / 2; y = x + (1 / ratio - 1) * t * t / (2 * Math.max(0.01, knee)); }
      pts.push((map(x) * W).toFixed(1) + ' ' + ((1 - map(y)) * H).toFixed(1));
    }
    const grid = [];
    for (let i = 1; i < 6; i++) { grid.push({ d: 'M' + (W * i / 6).toFixed(1) + ' 0V' + H, stroke: T.grid, sw: 1 }); grid.push({ d: 'M0 ' + (H * i / 6).toFixed(1) + 'H' + W, stroke: T.grid, sw: 1 }); }
    const tx = map(thr) * W;
    const grH = s.gr * 0.55 * H;
    disp(16, 150, W, H, grid.concat([
      { d: 'M' + tx.toFixed(1) + ' 0V' + H, stroke: rgba(AMBER, 0.6), sw: 1.2, dash: '4 4' },
      { d: 'M0 ' + H + 'L' + pts.join('L'), stroke: T.curve, sw: 2.4, f: T.lineF(C) },
      { d: 'M' + (W - 10) + ' 0h7v' + grH.toFixed(1) + 'h-7z', fill: AMBER, stroke: 'none', sw: 0, o: 0.85, f: T.lineF(AMBER) }
    ]), [{ x: 6, y: H - 8, t: 'Thr ' + f1(thr) + ' dB', anchor: 'start', fs: 10 }]);
    label(16, 388, 176, 'GR ' + f1(-s.gr * 9) + ' dB', { fs: 11, col: s.gr > 0.1 ? mix(AMBER, '#ffffff', 0.2) : T.label });

    card(206, 128, 552, 312, 'Compression');
    knob('cThr', 256, 158, 84, 'Threshold', f1(thr) + ' dB', { c: C });
    knob('cRatio', 440, 158, 84, 'Ratio', ratio >= 19.5 ? 'inf : 1' : f1(ratio) + ' : 1', { c: C });
    knob('cKnee', 624, 158, 84, 'Knee', f1(knee) + ' dB', { c: C });
    knob('cAtt', 263, 300, 70, 'Attack', f1(0.01 + Math.pow(v.cAtt, 2) * 30) + ' ms', { c: C });
    knob('cRel', 447, 300, 70, 'Release', Math.round(1 + Math.pow(v.cRel, 2) * 1000) + ' ms', { c: C });
    btn('cAutoRel', 586, 318, 160, 52, { txt: 'Auto Release', on: s.on.cAutoRel, color: AMBER, k: 0.8, click: function () { self.setOn('cAutoRel'); } });

    card(762, 128, 332, 312, 'Output');
    knob('cMix', 880, 160, 96, 'Dry / Wet', Math.round(v.cMix * 100) + ' %', { c: C });
    btn('cMakeup', 790, 330, 276, 52, { txt: 'Makeup Gain', on: s.on.cMakeup, color: AMBER, k: 0.8, click: function () { self.setOn('cMakeup'); } });

    card(6, 444, 352, 300, 'Sidechain');
    btn('cScOn', 18, 470, 70, 52, { txt: 'On', on: s.on.cScOn, color: AMBER, k: 0.8, click: function () { self.setOn('cScOn'); } });
    btn('cScListen', 18, 530, 70, 52, { txt: 'Listen', on: s.on.cScListen, color: AMBER, k: 0.8, click: function () { self.setOn('cScListen'); } });
    label(96, 470, 150, 'Audio From', { fs: 10, tt: 'uppercase', ls: '0.06em' });
    btn('cScSrc', 100, 488, 142, 44, { txt: 'Drum Rack', fs: 14 });
    label(96, 560, 150, 'Position', { fs: 10, tt: 'uppercase', ls: '0.06em' });
    btn('cScPos', 100, 578, 142, 44, { txt: 'Post FX', fs: 14 });
    knob('cScGain', 262, 466, 66, 'Gain', f1((v.cScGain - 0.5) * 48) + ' dB', { c: C, bip: true });
    knob('cScMix', 262, 600, 66, 'Mix', Math.round(v.cScMix * 100) + ' %', { c: C });

    card(362, 444, 396, 300, 'Sidechain EQ');
    btn('cScEqOn', 374, 470, 70, 112, { txt: 'On', on: s.on.cScEqOn, color: AMBER, k: 0.8, click: function () { self.setOn('cScEqOn'); } });
    const types = [['ls', 'Low Shelf'], ['bell', 'Bell'], ['hs', 'High Shelf'], ['lpf', 'Low pass'], ['peak', 'Peak'], ['hp', 'High pass']];
    types.forEach(function (t, i) {
      btn('csc' + t[0], 452 + (i % 3) * 74, 470 + Math.floor(i / 3) * 60, 68, 52, { txt: t[1], fs: 12, on: s.sel.cScType === t[0], color: AMBER, k: 0.8, click: function () { self.setSel('cScType', t[0]); } });
    });
    knob('cScFreq', 680, 466, 62, 'Freq', Math.round(30 * Math.pow(500, v.cScFreq)) + ' Hz', { c: AMBER });
    knob('cScQ', 680, 600, 62, 'Q', (0.1 + v.cScQ * 2).toFixed(2), { c: AMBER });
    label(374, 610, 290, 'Sidechain filter shapes what the detector hears.', { fs: 11, align: 'left', col: T.label });

    card(762, 444, 332, 300, 'Detection');
    label(762, 462, 332, 'Mode', { fs: 10, tt: 'uppercase', ls: '0.06em' });
    seg('cm', 776, 478, 304, 50, [['peak', 'Peak'], ['rms', 'RMS'], ['exp', 'Expand']], 'cMode', AMBER);
    label(762, 544, 332, 'Look Ahead', { fs: 10, tt: 'uppercase', ls: '0.06em' });
    seg('cl', 776, 560, 304, 50, [['0', '0 ms'], ['1', '1 ms'], ['10', '10 ms']], 'cLook', AMBER);
    label(762, 626, 332, 'Release Curve', { fs: 10, tt: 'uppercase', ls: '0.06em' });
    seg('cc', 776, 642, 304, 50, [['lin', 'Lin'], ['log', 'Log']], 'cCurve', AMBER);
  }

  // ---- Wavetable --------------------------------------------------------------
  buildWT(T, s, look, g, card, btn, knob, label, disp, seg) {
    const self = this, v = s.v, OC = '#f2a12e', FC = '#4c9bff', EC = '#4cc24a', LC = '#d45dbf';
    const wave = function (shape, t, ph) {
      // morph sine -> saw -> square by t, shape offsets the table
      const x = ph * 2 * Math.PI, sine = Math.sin(x), saw = 1 - 2 * ph, sq = ph < 0.5 ? 1 : -1;
      const tt = (t + shape) % 1;
      if (tt < 0.5) { const k = tt * 2; return sine * (1 - k) + saw * k; }
      const k = (tt - 0.5) * 2; return saw * (1 - k) + sq * k * 0.9;
    };
    const table = function (key, shape, c, on) {
      const W = 336, H = 150, N = 14, pos = v[key], cur = Math.round(pos * (N - 1)), paths = [];
      for (let i = N - 1; i >= 0; i--) {
        const ox = i * 6, oy = -i * 5, amp = 30, base = 112;
        let p = '';
        for (let j = 0; j <= 90; j++) {
          const ph = j / 90, y = base + oy - wave(shape, i / (N - 1), ph) * amp;
          p += (j ? 'L' : 'M') + (16 + ox + ph * 230).toFixed(1) + ' ' + y.toFixed(1);
        }
        const isCur = i === cur;
        paths.push({ d: p, stroke: isCur ? c : (look === 'satin' ? 'rgba(255,240,220,0.22)' : 'rgba(255,255,255,0.18)'), sw: isCur ? 2.4 : 1, o: on ? (isCur ? 1 : 0.4 + 0.6 * (1 - Math.abs(i - cur) / N)) : 0.25, f: isCur && on ? T.lineF(c) : 'none' });
      }
      return paths;
    };
    const osc = function (n, x, key, shape, tableName) {
      const on = s.on['osc' + n];
      card(x, 128, 360, 312, '');
      btn('osc' + n, x + 12, 136, 92, 30, { txt: 'Osc ' + n, fs: 13, fw: 500, on: on, color: OC, k: 0.8, click: function () { self.setOn('osc' + n); } });
      btn('tbl' + n, x + 112, 136, 236, 30, { txt: tableName, fs: 12, jc: 'flex-start', pad: '0 12px' });
      disp(x + 12, 174, 336, 150, table('wPos' + n, shape, OC, on), []);
      knob('wPos' + n, x + 20, 336, 52, 'Position', Math.round(v['wPos' + n] * 100) + ' %', { c: OC });
      knob('wFm' + n, x + 106, 336, 52, 'FM', Math.round(v['wFm' + n] * 100) + ' %', { c: OC });
      knob('wFx' + n, x + 192, 336, 52, 'Classic', Math.round(v['wFx' + n] * 100) + ' %', { c: OC });
      knob('wGain' + n, x + 278, 336, 52, 'Gain', f1((v['wGain' + n] - 0.75) * 40) + ' dB', { c: OC });
    };
    osc(1, 6, 'wPos1', 0, 'Basics · Basic Shapes');
    osc(2, 370, 'wPos2', 0.35, 'Distortion · Harmonic Fold');
    card(734, 128, 118, 312, '');
    btn('sub', 744, 136, 98, 30, { txt: 'Sub', fs: 13, fw: 500, on: s.on.sub, color: OC, k: 0.8, click: function () { self.setOn('sub'); } });
    knob('subGain', 760, 186, 66, 'Gain', f1((v.subGain - 0.75) * 40) + ' dB', { c: OC });
    knob('subTone', 760, 292, 66, 'Tone', Math.round(v.subTone * 100) + ' %', { c: OC });
    seg('oct', 744, 396, 98, 32, [['-1', '-1'], ['0', '0'], ['1', '+1']], 'oct', OC, { fs: 12 });

    // filter
    card(856, 128, 238, 312, '');
    btn('flt', 866, 136, 218, 30, { txt: 'Filter 1 · Lowpass · Clean', fs: 12 });
    const FW = 218, FH = 120, fc = v.fFreq, res = v.fRes, fp = [];
    for (let i = 0; i <= 80; i++) {
      const x = i / 80, o = (x - fc) * 8;
      let db = o <= 0 ? 0 : -o * 6;
      db += res * 12 * Math.exp(-Math.pow((x - fc) * 14, 2));
      fp.push((x * FW).toFixed(1) + ' ' + (FH * 0.55 - db * 2.6).toFixed(1));
    }
    disp(866, 174, FW, FH, [{ d: 'M' + fp.join('L'), stroke: T.curve, sw: 2.2, f: T.lineF(FC) }, { d: 'M' + fp.join('L') + 'L' + FW + ' ' + FH + 'L0 ' + FH + 'Z', fill: rgba(FC, 0.12), stroke: 'none', sw: 0 }]);
    knob('fFreq', 868, 312, 54, 'Freq', Math.round(20 * Math.pow(1000, fc)) + ' Hz', { c: FC });
    knob('fRes', 940, 312, 54, 'Res', Math.round(res * 100) + ' %', { c: FC });
    knob('fDrive', 1012, 312, 54, 'Drive', f1(v.fDrive * 24) + ' dB', { c: FC });

    // envelope
    card(6, 444, 360, 300, '');
    seg('env', 18, 452, 336, 30, [['amp', 'Amp'], ['env2', 'Env 2'], ['env3', 'Env 3']], 'envTab', EC, { fs: 12 });
    const EW = 336, EH = 110, a = v.eA, dd = v.eD, su = v.eS, r = v.eR;
    const xa = 8 + a * 80, xd = xa + dd * 90, xs = xd + 70, xr = Math.min(EW - 8, xs + r * 90);
    const ep = 'M8 ' + (EH - 8) + 'L' + xa.toFixed(1) + ' 10L' + xd.toFixed(1) + ' ' + (10 + (1 - su) * (EH - 18)).toFixed(1) + 'L' + xs.toFixed(1) + ' ' + (10 + (1 - su) * (EH - 18)).toFixed(1) + 'L' + xr.toFixed(1) + ' ' + (EH - 8);
    disp(18, 490, EW, EH, [{ d: ep + 'Z', fill: rgba(EC, 0.12), stroke: 'none', sw: 0 }, { d: ep, stroke: T.curve, sw: 2.2, f: T.lineF(EC) }]);
    knob('eA', 22, 616, 52, 'Attack', Math.round(Math.pow(a, 2) * 2000) + ' ms', { c: EC });
    knob('eD', 108, 616, 52, 'Decay', Math.round(Math.pow(dd, 2) * 3000) + ' ms', { c: EC });
    knob('eS', 194, 616, 52, 'Sustain', Math.round(su * 100) + ' %', { c: EC });
    knob('eR', 280, 616, 52, 'Release', Math.round(Math.pow(r, 2) * 4000) + ' ms', { c: EC });

    // LFO
    card(370, 444, 360, 300, '');
    seg('lfo', 382, 452, 236, 30, [['lfo1', 'LFO 1'], ['lfo2', 'LFO 2']], 'lfoTab', LC, { fs: 12 });
    btn('lSync', 626, 452, 92, 30, { txt: 'Sync', fs: 12, on: s.on.lSync, color: LC, k: 0.8, click: function () { self.setOn('lSync'); } });
    const LW = 336, LH = 110, lp = [];
    const ph0 = s.playing ? (s.beat % 32) / 32 : 0;
    for (let i = 0; i <= 120; i++) {
      const x = i / 120, ph = x * (1 + v.lRate * 3) + ph0;
      const tri = 1 - 4 * Math.abs((ph % 1) - 0.5), sine = Math.sin(ph * 2 * Math.PI), yv = sine * (1 - v.lShape) + tri * v.lShape;
      lp.push((x * LW).toFixed(1) + ' ' + (LH / 2 - yv * v.lAmt * (LH / 2 - 10)).toFixed(1));
    }
    disp(382, 490, LW, LH, [{ d: 'M0 ' + LH / 2 + 'H' + LW, stroke: T.grid, sw: 1 }, { d: 'M' + lp.join('L'), stroke: T.curve, sw: 2.2, f: T.lineF(LC) }]);
    knob('lRate', 410, 616, 56, 'Rate', ['1/1', '1/2', '1/4', '1/8', '1/16'][Math.min(4, Math.floor(v.lRate * 5))], { c: LC });
    knob('lAmt', 522, 616, 56, 'Amount', Math.round(v.lAmt * 100) + ' %', { c: LC });
    knob('lShape', 634, 616, 56, 'Shape', Math.round(v.lShape * 100) + ' %', { c: LC });

    // mod matrix
    card(734, 444, 360, 300, 'Matrix');
    const cols = [['p1', 'Osc 1 Pos'], ['p2', 'Osc 2 Pos'], ['f', 'Filter Freq'], ['a', 'Amp']];
    const rows = [['env2', 'Env 2', EC], ['env3', 'Env 3', EC], ['lfo1', 'LFO 1', LC], ['lfo2', 'LFO 2', LC], ['midi', 'Velocity', OC]];
    cols.forEach(function (c, ci) { label(812 + ci * 70, 466, 66, c[1], { fs: 9.5 }); });
    rows.forEach(function (rw, ri) {
      label(744, 492 + ri * 48, 64, rw[1], { align: 'left', fs: 11.5, col: T.text });
      cols.forEach(function (c, ci) {
        const key = rw[0] + '-' + c[0], amt = s.matrix[key] || 0;
        btn('mx' + key, 812 + ci * 70, 482 + ri * 48, 64, 40, { txt: amt ? (amt > 0 ? '+' : '') + Math.round(amt * 100) : '', fs: 12, on: amt !== 0, color: rw[2], k: 0.3 + Math.abs(amt), click: function () {
          self.setState(function (st) {
            const m = Object.assign({}, st.matrix), steps = [0, 0.25, 0.5, 1, -0.5], idx = steps.indexOf(m[key] || 0);
            m[key] = idx < 0 ? 0 : steps[(idx + 1) % steps.length];
            return { matrix: m };
          });
        } });
      });
    });
  }

  // ---- Drum Rack --------------------------------------------------------------
  buildDrum(T, s, look, g, card, btn, knob, label, disp, seg) {
    const self = this, v = s.v;
    // header extras
    [['Labels', false], ['Arm', false], ['Pads', true], ['Steps', false], ['Mix', false]].forEach(function (it, i) {
      btn('dh' + it[0], 220 + i * 72, 82, 66, 32, { txt: it[0], fs: 12, on: it[1], color: BLUE, k: 0.7 });
    });
    const rk = [['Rand', 584, 44], ['Store', 632, 48], ['<', 686, 28], [s.rack + ' / 4', 718, 40], ['>', 762, 28]];
    rk.forEach(function (it, i) {
      btn('rk' + i, it[1] - 8, 82, it[2], 32, { txt: it[0], fs: 12, label: 'Rack ' + it[0],
        click: i === 2 ? function () { self.setState(function (st) { return { rack: Math.max(1, st.rack - 1) }; }); } : (i === 4 ? function () { self.setState(function (st) { return { rack: Math.min(4, st.rack + 1) }; }); } : undefined) });
    });

    card(6, 128, 620, 616, 'Pads · C1 – D#2');
    const pw = 142, ph = 140, gap = 8;
    for (let i = 0; i < 16; i++) {
      const col = i % 4, row = Math.floor(i / 4), x = 18 + col * (pw + gap), y = 150 + (3 - row) * (ph + gap);
      const hit = (s.hits[i] || 0) > 0, selP = s.sel.pad === i, c = PADC[i];
      const notes = ['C1', 'C#1', 'D1', 'D#1', 'E1', 'F1', 'F#1', 'G1', 'G#1', 'A1', 'A#1', 'B1', 'C2', 'C#2', 'D2', 'D#2'];
      btn('pad' + i, x, y, pw, ph, {
        txt: PADS[i], sub: notes[i], fs: 13.5, fw: 500, sfs: 10.5, fd: 'column', ai: 'flex-start', jc: 'flex-end', gap: 3, pad: '0 12px 12px',
        on: hit || selP, color: hit ? c : '#cfd6e2', k: hit ? 1.2 : 0.25, rad: 12,
        tr: hit ? 'transform 60ms ease-out, box-shadow 40ms linear, background 40ms linear, color 40ms' : 'transform 90ms ease-out, box-shadow 520ms ease-out, background 520ms ease-out, color 400ms',
        click: function () {
          self.setSel('pad', i);
          self.setState(function (st) { const h = Object.assign({}, st.hits); h[i] = 1; return { hits: h }; });
          setTimeout(function () { self.setState(function (st) { const h = Object.assign({}, st.hits); h[i] = 0; return { hits: h }; }); }, 90);
        }
      });
    }

    const pc = PADC[s.sel.pad];
    card(630, 128, 464, 312, PADS[s.sel.pad] + ' · Simpler');
    const WW = 440, WH = 130, wp = [];
    const seed = s.sel.pad * 7.3 + 1;
    for (let i = 0; i <= 220; i++) {
      const x = i / 220, env = Math.exp(-x * (3 + (s.sel.pad % 4) * 2) * (1.6 - v.pDecay)), n = Math.sin(i * seed) * 0.5 + Math.sin(i * seed * 0.37) * 0.5;
      wp.push({ x: x * WW, a: Math.abs(n) * env * (WH / 2 - 8) + 1 });
    }
    const top = 'M' + wp.map(function (p) { return p.x.toFixed(1) + ' ' + (WH / 2 - p.a).toFixed(1); }).join('L');
    const bot = wp.slice().reverse().map(function (p) { return p.x.toFixed(1) + ' ' + (WH / 2 + p.a).toFixed(1); }).join('L');
    disp(642, 150, WW, WH, [{ d: 'M0 ' + WH / 2 + 'H' + WW, stroke: T.grid, sw: 1 }, { d: top + 'L' + bot + 'Z', fill: rgba(pc, 0.35), stroke: mix(pc, '#ffffff', 0.25), sw: 1, f: T.lineF(pc) }]);
    knob('pVol', 652, 296, 56, 'Volume', f1((v.pVol - 0.85) * 60) + ' dB', { c: pc });
    knob('pPan', 724, 296, 56, 'Pan', v.pPan === 0.5 ? 'C' : Math.round(Math.abs(v.pPan - 0.5) * 100) + (v.pPan < 0.5 ? 'L' : 'R'), { c: pc, bip: true });
    knob('pTune', 796, 296, 56, 'Tune', Math.round((v.pTune - 0.5) * 48) + ' st', { c: pc, bip: true });
    knob('pDecay', 868, 296, 56, 'Decay', Math.round(Math.pow(v.pDecay, 2) * 2000) + ' ms', { c: pc });
    knob('pSendA', 940, 296, 56, 'Send A', Math.round(v.pSendA * 100) + ' %', { c: pc });
    knob('pSendB', 1012, 296, 56, 'Send B', Math.round(v.pSendB * 100) + ' %', { c: pc });

    card(630, 444, 464, 300, 'Macros');
    const MN = ['Tune', 'Decay', 'Tone', 'Drive', 'Space', 'Swing', 'Body', 'Snap'];
    for (let i = 0; i < 8; i++) {
      const key = 'm' + (i + 1);
      knob(key, 652 + (i % 4) * 112, 472 + Math.floor(i / 4) * 136, 64, MN[i], Math.round(v[key] * 127), { c: '#4c9bff' });
    }
  }
}
